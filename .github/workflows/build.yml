name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls /Applications | grep -i Xcode || true
          sudo xcode-select -switch /Applications/Xcode_16.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CrashLogViewer.xcodeproj \
            -scheme CrashLogViewer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build | xcpretty || true
          # fallback without xcpretty if it failed silently
          if [ ! -d "build/Build/Products/Release-iphoneos/CrashLogViewer.app" ]; then
            xcodebuild \
              -project CrashLogViewer.xcodeproj \
              -scheme CrashLogViewer \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              ONLY_ACTIVE_ARCH=NO \
              clean build
          fi

      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 -type d | head -n1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"; exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Apply entitlements via ldid (for jailbreak/TrollStore)
        run: |
          brew install ldid || true
          APP="${{ steps.locate.outputs.app_path }}"
          BIN="$APP/CrashLogViewer"
          if command -v ldid >/dev/null 2>&1 && [ -f App/CrashLogViewer.entitlements ]; then
            ldid -S"App/CrashLogViewer.entitlements" "$BIN" || echo "ldid signing skipped"
          fi

      - name: Package IPA
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          rm -rf Payload CrashLogViewer.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr CrashLogViewer.ipa Payload
          echo "=== IPA created ==="
          ls -lh CrashLogViewer.ipa
          unzip -l CrashLogViewer.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashLogViewer-unsigned-ipa
          path: CrashLogViewer.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: CrashLogViewer v1.0.0 (build ${{ github.run_number }})
          body: |
            未签名 IPA，适用于越狱 / TrollStore 环境。
            - TrollStore：直接安装即可（会自动赋予 entitlements）。
            - 越狱：用你的签名工具或 AppSync 安装。
          files: CrashLogViewer.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
