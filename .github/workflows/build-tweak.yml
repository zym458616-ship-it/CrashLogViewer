name: Build CrashCatcher Tweak

on:
  push:
    branches: [ main ]
    paths:
      - 'tweak/**'
      - '.github/workflows/build-tweak.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tweak:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -switch "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install ldid + dpkg
        run: |
          brew install ldid dpkg make || true

      - name: Set up Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # macOS 上 Theos 直接用 Xcode 的 clang，无需额外交叉工具链
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build package (rootful + rootless)
        run: |
          export THEOS=$HOME/theos
          cd tweak
          mkdir -p out
          echo "===== rootful ====="
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootful 2>&1 | tail -40 || true
          find . -name "*.deb" -exec cp {} out/ \; || true
          echo "===== rootless ====="
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tail -40 || true
          # rename rootless deb to avoid clobbering rootful
          for d in packages/*.deb ./*.deb; do
            [ -f "$d" ] || continue
            base=$(basename "$d" .deb)
            cp "$d" "out/${base}_rootless.deb"
          done
          echo "===== collected debs ====="
          ls -lh out || true
          test -n "$(ls out/*.deb 2>/dev/null)" || { echo 'NO DEB PRODUCED'; exit 1; }

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashCatcher-tweak-deb
          path: tweak/out/*.deb
          if-no-files-found: warn

      - name: Attach deb to release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tweak-v1.0.0-build${{ github.run_number }}
          name: CrashCatcher Tweak v1.0.0 (build ${{ github.run_number }})
          body: |
            CrashCatcher 越狱插件 (.deb)。注入所有 App，主动捕获崩溃并写详细日志。
            含 rootful 与 rootless 两种包，按你的越狱环境选择安装。
            安装后配合 CrashLogViewer 使用。
          files: tweak/out/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
