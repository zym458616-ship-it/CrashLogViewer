name: Build CrashCatcher Tweak

on:
  push:
    branches: [ main ]
    paths:
      - 'tweak/**'
      - '.github/workflows/build-tweak.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tweak:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -switch "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install ldid + dpkg
        run: brew install ldid dpkg make xz || true

      - name: Set up roothide Theos
        run: |
          export THEOS=$HOME/theos
          # roothide 隐根越狱专属 theos fork（内置 roothide 打包方案）
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          # iOS SDK
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar xzf - -C /tmp
          mv /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build roothide package
        run: |
          export THEOS=$HOME/theos
          cd tweak
          mkdir -p out
          echo "===== roothide scheme ====="
          make clean || true
          make package FINALPACKAGE=1 2>&1 | tail -60 || true
          echo "===== collected debs ====="
          find . -name "*.deb" -exec cp {} out/ \; || true
          ls -lh out || true
          test -n "$(ls out/*.deb 2>/dev/null)" || { echo 'NO DEB PRODUCED'; exit 1; }

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashCatcher-roothide-deb
          path: tweak/out/*.deb
          if-no-files-found: warn

      - name: Attach deb to release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tweak-roothide-build${{ github.run_number }}
          name: CrashCatcher (roothide) v1.0.0 build ${{ github.run_number }}
          body: |
            CrashCatcher 隐根越狱(roothide)专属插件 (.deb)。
            注入所有 App，主动捕获崩溃并写详细日志，供 CrashLogViewer 读取。
            用 Sileo/Zebra 安装后重启或注销即可。
          files: tweak/out/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
